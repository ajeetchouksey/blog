<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <style>
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #333; }
    .stat { font-family: Arial, sans-serif; font-size: 14px; fill: #555; }
    .icon { font-size: 24px; }
    .box { fill: #f9f9f9; stroke: #ddd; stroke-width: 1; rx: 10; }
  </style>

  <!-- Over-Personalization -->
  <rect x="20" y="20" width="360" height="100" class="box" />
  <text x="40" y="50" class="icon">🎯</text>
  <text x="80" y="50" class="title">Over-Personalization</text>
  <text x="40" y="80" class="stat">80% prefer personalization, but risks exist.</text>

  <!-- Opaque Recommendations -->
  <rect x="420" y="20" width="360" height="100" class="box" />
  <text x="440" y="50" class="icon">🕵️‍♂️</text>
  <text x="480" y="50" class="title">Opaque Recommendations</text>
  <text x="440" y="80" class="stat">79% worry about data use transparency.</text>

  <!-- Privacy Concerns -->
  <rect x="20" y="140" width="360" height="100" class="box" />
  <text x="40" y="170" class="icon">🔒</text>
  <text x="80" y="170" class="title">Privacy Concerns</text>
  <text x="40" y="200" class="stat">71% shop more with trusted data use.</text>

  <!-- Biased Signals -->
  <rect x="420" y="140" width="360" height="100" class="box" />
  <text x="440" y="170" class="icon">⚖️</text>
  <text x="480" y="170" class="title">Biased Signals</text>
  <text x="440" y="200" class="stat">AI reduces stockouts by 20-50%, but bias risks remain.</text>

  <!-- Feature Fragility -->
  <rect x="20" y="260" width="760" height="100" class="box" />
  <text x="40" y="290" class="icon">🧩</text>
  <text x="80" y="290" class="title">Feature Fragility</text>
  <text x="40" y="320" class="stat">AR boosts conversions by 40%, but only if reliable.</text>
</svg>
