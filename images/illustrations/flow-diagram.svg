<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <rect width="800" height="220" fill="#ffffff"/>
  <style>
    .box{fill:#0ea5e9;opacity:0.95;}
    .text{fill:#fff;font-family:Segoe UI, Roboto, Arial;font-size:14px;font-weight:600}
    .muted{fill:#475569;font-family:Segoe UI, Roboto, Arial;font-size:12px}
  </style>
  <rect x="20" y="40" width="180" height="80" rx="10" class="box"/>
  <text x="30" y="70" class="text">You (visitor)</text>
  <text x="30" y="92" class="muted">query, intent</text>

  <rect x="260" y="20" width="200" height="120" rx="10" fill="#7c3aed"/>
  <text x="280" y="64" class="text">Ava — personalization</text>
  <text x="280" y="90" class="muted">recommendations, UI adapt</text>

  <rect x="520" y="40" width="180" height="80" rx="10" fill="#f59e0b"/>
  <text x="540" y="70" class="text">Visualize</text>
  <text x="540" y="92" class="muted">AR / 3D previews</text>

  <path d="M200 80 L260 80" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M460 80 L520 80" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>
