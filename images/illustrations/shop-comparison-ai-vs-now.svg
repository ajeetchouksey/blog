<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <style>
    .bg { fill: #f7fafc; }
    .card { fill: #ffffff; stroke: #e6e9ee; stroke-width: 2; rx: 16; }
    .phone { fill: #111827; rx: 24; }
    .screen { fill: #0f172a; rx: 16; }
    .title { font: 700 22px/1.1 'Segoe UI', Roboto, sans-serif; fill: #0f172a; }
    .section-label { font: 600 18px/1 'Segoe UI', Roboto, sans-serif; fill: #111827; }
    .muted { font: 400 14px/1 'Segoe UI', Roboto, sans-serif; fill: #6b7280; }
    .chip { fill: #eef2ff; stroke: #c7d2fe; rx: 12; }
    .chip-ai { fill: #ecfdf5; stroke: #bbf7d0; }
    .badge { fill: #fffbeb; stroke: #fef3c7; rx: 8; }
    .accent { fill: #60a5fa; }
    .accent-2 { fill: #34d399; }
    .line { stroke: #e6e9ee; stroke-width: 1; }
  </style>

  <rect width="1200" height="720" class="bg" rx="10" />

  <!-- Header -->
  <text x="48" y="46" class="title">Now vs Future — side-by-side comparison</text>
  <text x="48" y="74" class="muted">Left: today's common shopping app. Right: same app reimagined with AI features to speed decisions and reduce friction.</text>

  <!-- Left card (Now) -->
  <g transform="translate(48,110)">
    <rect width="520" height="540" class="card" />
    <text x="22" y="42" class="section-label">Current experience — "Now"</text>

    <!-- phone mockup -->
    <g transform="translate(22,72)">
      <rect width="200" height="420" fill="#0b1220" rx="22" />
      <rect x="12" y="10" width="176" height="396" fill="#ffffff" rx="14" />
      <!-- screen content: header, search, list -->
      <rect x="18" y="18" width="140" height="18" fill="#111827" rx="6" />
      <rect x="18" y="44" width="140" height="34" fill="#f3f4f6" rx="8" />
      <text x="22" y="74" class="muted">Search (manual)</text>

      <!-- product cards stacked -->
      <g transform="translate(18,92)">
        <rect width="140" height="64" fill="#f8fafc" rx="8" stroke="#e6e9ee" />
        <rect y="80" width="140" height="64" fill="#f8fafc" rx="8" stroke="#e6e9ee" />
        <rect y="160" width="140" height="64" fill="#f8fafc" rx="8" stroke="#e6e9ee" />
      </g>

      <!-- footer slow delivery -->
      <rect x="18" y="330" width="140" height="36" fill="#fff1f2" rx="8" stroke="#fecaca" />
      <text x="26" y="354" class="muted">Delivery: 5-7 days</text>
    </g>

    <!-- notes on left -->
    <g transform="translate(248,92)">
      <circle cx="16" cy="12" r="12" fill="#fca5a5" />
      <text x="40" y="18" class="muted">Generic recommendations (no context)</text>

      <circle cx="16" cy="62" r="12" fill="#fca5a5" />
      <text x="40" y="68" class="muted">Manual search required</text>

      <circle cx="16" cy="112" r="12" fill="#fca5a5" />
      <text x="40" y="118" class="muted">Slow, unclear delivery info</text>

      <circle cx="16" cy="162" r="12" fill="#fca5a5" />
      <text x="40" y="168" class="muted">Limited product visualization</text>
    </g>
  </g>

  <!-- Right card (Future with AI) -->
  <g transform="translate(632,110)">
    <rect width="520" height="540" class="card" />
    <text x="22" y="42" class="section-label">Future — "With AI"</text>

    <!-- phone mockup -->
    <g transform="translate(22,72)">
      <rect width="200" height="420" fill="#0b1220" rx="22" />
      <rect x="12" y="10" width="176" height="396" fill="#ffffff" rx="14" />

      <!-- personalized header -->
      <rect x="18" y="18" width="140" height="28" class="chip" />
      <text x="26" y="36" class="muted">Welcome back — Recommended for you</text>

      <!-- small personalization chips -->
      <g transform="translate(18,56)">
        <rect width="56" height="26" class="chip-ai" />
        <rect x="66" width="56" height="26" class="chip-ai" />
        <rect x="132" width="56" height="26" class="chip-ai" />
      </g>

      <!-- product cards with AR and explainability -->
      <g transform="translate(18,96)">
        <rect width="140" height="64" fill="#f8fffb" rx="8" stroke="#d1fae5" />
        <g transform="translate(6,8)">
          <rect width="36" height="48" fill="#e6fffa" rx="6" />
          <text x="48" y="24" class="muted">Ergo Chair</text>
          <text x="48" y="40" class="muted">Because you viewed it</text>
          <!-- AR icon -->
          <circle cx="116" cy="36" r="10" class="accent-2" />
        </g>

        <rect y="84" width="140" height="64" fill="#f8fffb" rx="8" stroke="#d1fae5" />
        <g transform="translate(6,92)">
          <rect width="36" height="48" fill="#eef2ff" rx="6" />
          <text x="48" y="24" class="muted">Desk Lamp</text>
          <text x="48" y="40" class="muted">Top-rated for small desks</text>
        </g>
      </g>

      <!-- delivery and fast badge -->
      <rect x="18" y="300" width="140" height="36" class="badge" />
      <text x="28" y="324" class="muted">Delivery: same day (nearby)</text>

      <!-- chat suggestion -->
      <rect x="18" y="344" width="140" height="36" fill="#fff7ed" stroke="#ffedd5" rx="8" />
      <text x="28" y="368" class="muted">Got a question? Chat with our assistant</text>
    </g>

    <!-- notes on right -->
    <g transform="translate(248,92)">
      <circle cx="16" cy="12" r="12" fill="#bbf7d0" />
      <text x="40" y="18" class="muted">Personalized picks using intent & context</text>

      <circle cx="16" cy="62" r="12" fill="#bbf7d0" />
      <text x="40" y="68" class="muted">Visual try-ons & AR preview</text>

      <circle cx="16" cy="112" r="12" fill="#bbf7d0" />
      <text x="40" y="118" class="muted">Faster delivery estimates with inventory signals</text>

      <circle cx="16" cy="162" r="12" fill="#bbf7d0" />
      <text x="40" y="168" class="muted">Explainable recommendations & easy controls</text>
    </g>
  </g>

  <!-- center divider and label -->
  <line x1="600" y1="110" x2="600" y2="646" stroke="#e6e9ee" stroke-width="2" stroke-dasharray="4 6" />
  <text x="588" y="92" class="muted" transform="rotate(-90 588,92)">Then → Now → Future</text>

  <!-- footer note -->
  <text x="48" y="686" class="muted">Illustration: left = typical app today; right = the same app enhanced by practical AI features that reduce friction and speed decisions.</text>

</svg>
